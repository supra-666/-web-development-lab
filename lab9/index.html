
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Лаб 9 - JavaScript Validation</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/algorithms.js" defer></script>
    <script src="js/validators.js" defer></script>
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <h1>Миний зургийн галерей</h1>
        <p>Лаборатори 9 - JavaScript Validation</p>
    </header>

    <nav>
        <a href="#gallery">Галерей</a>
        <a href="#feedback">Санал хүсэлт</a>
    </nav>

    <main>
        <section id="gallery">
            <h2>Зургийн цомог</h2>
            <div class="gallery">
                <img src="../lab6/img/photo1.jpg"
                     alt="Байгалийн зураг">
                <img src="../lab6/img/photo2.jpg"
                     alt="Хотын зураг">
                <img src="../lab6/img/photo3.jpg"
                     alt="Уулын зураг">
            </div>
        </section>

        <section id="feedback">
            <h2>Санал хүсэлт илгээх</h2>
            <p>Доорх талбаруудыг бөглөнө үү.</p>

            <form id="feedbackForm" novalidate>

                <div class="form-group">
                    <label for="name">Нэр:</label>
                    <input type="text" id="name"
                           placeholder="Нэрээ оруулна уу">
                    <small id="nameError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Имэйл:</label>
                    <input type="email" id="email"
                           placeholder="example@gmail.com">
                    <small id="emailError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Нууц үг:</label>
                    <input type="password" id="password"
                           placeholder="8-аас дээш тэмдэгт">
                    <small id="passwordError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="message">Санал хүсэлт:</label>
                    <textarea id="message" rows="5"
                              placeholder="Санал хүсэлтээ бичнэ үү"></textarea>
                    <small id="messageError" class="error"></small>
                </div>

                <button type="submit">Илгээх</button>
                <button type="reset" class="reset">Цэвэрлэх</button>

                <p id="result" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>2026 он | Веб зохиомж - Лаборатори 9</p>
    </footer>
</body>
</html>
