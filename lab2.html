
<!DOCTYPE html>
<html lang="mn">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатори 2 - Анкет</title>
</head>
<body>

    <header>
        <h1>Оюутны бүртгэлийн анкет</h1>
        <p>Хувийн мэдээллээ бөглөнө үү.</p>
    </header>

    <main>
        <form action="#" method="get">

            <label for="name">Овог нэр:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Имэйл хаяг:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Нууц үг:</label>
            <input type="password" id="password"
                   name="password" minlength="6" required>
            <br><br>

            <label for="birthdate">Төрсөн огноо:</label>
            <input type="date" id="birthdate" name="birthdate" required>
            <br><br>

            <p>Хүйс:</p>
            <input type="radio" id="male" name="gender"
                   value="male" required>
            <label for="male">Эрэгтэй</label>

            <input type="radio" id="female" name="gender"
                   value="female">
            <label for="female">Эмэгтэй</label>
            <br><br>

            <p>Сонирхол:</p>
            <input type="checkbox" id="sport"
                   name="hobby" value="sport">
            <label for="sport">Спорт</label>

            <input type="checkbox" id="music"
                   name="hobby" value="music">
            <label for="music">Хөгжим</label>

            <input type="checkbox" id="game"
                   name="hobby" value="game">
            <label for="game">Тоглоом</label>
            <br><br>

            <label for="course">Суралцаж буй курс:</label>
            <select id="course" name="course" required>
                <option value="">Сонгоно уу</option>
                <option value="1">1-р курс</option>
                <option value="2">2-р курс</option>
                <option value="3">3-р курс</option>
                <option value="4">4-р курс</option>
            </select>
            <br><br>

            <label for="phone">Утасны дугаар:</label>
            <input type="tel" id="phone" name="phone"
                   pattern="[0-9]{8}"
                   title="8 оронтой утасны дугаар оруулна уу"
                   required>
            <br><br>

            <button type="submit">Илгээх</button>
            <button type="reset">Цэвэрлэх</button>

        </form>
    </main>

    <footer>
        <p>Лаборатори 2 - Веб зохиомж</p>
    </footer>

</body>
</html>
